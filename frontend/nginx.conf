server {
    listen 80;
    root /usr/share/nginx/html;

    # API e documentação na mesma origem do app: sem CORS (ADR-0003)
    location ~ ^/(api|v3/api-docs|swagger-ui)(/|\.|$) {
        proxy_pass http://backend:8080;
        # mantém localhost:8080 nos redirects do backend (ex.: /swagger-ui.html)
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
