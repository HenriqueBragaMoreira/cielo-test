spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portabilidade}
spring.datasource.username=${DB_USER:portabilidade}
spring.datasource.password=${DB_PASSWORD:portabilidade}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

central.url=${CENTRAL_URL:http://localhost:4000}
# Timeouts do adaptador da Central (ADR-0007); a Central é o único cliente HTTP do backend.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
